name: 주간 QC 리포트

on:
  schedule:
    - cron: '0 0 * * 5'  # 금요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qc-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: QC 리포트 생성 및 Slack 전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python .github/scripts/qc_report.py

      - name: QC_REPORT.md 커밋
        run: |
          git config user.email "claude-qc-bot@biteme.co.kr"
          git config user.name "Claude QC Bot"
          git add QC_REPORT.md
          git diff --staged --quiet || git commit -m "chore: 주간 QC 리포트 자동 업데이트 ($(date +%Y%m%d))"
          git push
